services:
  background-agent:
    image: joyai-vl-background-model:latest
    build:
      context: .
      network: host
      dockerfile: Dockerfile.background
      args:
        CODEX_NPM_PACKAGE: "${CODEX_NPM_PACKAGE:-@openai/codex@latest}"
    working_dir: /workspace/JoyAI-VL-Interaction-main/services/background-agent
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
    environment:
      HOME: "/tmp"
      TMPDIR: "/tmp"
      CODEX_HOME: "/tmp/codex-home"
      CODEX_API_HOST: "0.0.0.0"
      CODEX_API_PORT: "${BACKGROUND_AGENT_PORT:-8079}"
      CODEX_API_WORKSPACE: "${BACKGROUND_WORKSPACE_CONTAINER:-/workspace/agent-workspace}"
      CODEX_API_MAX_SUBAGENTS: "${BACKGROUND_AGENT_MAX_SUBAGENTS:-6}"
      CODEX_API_TIMEOUT_SECONDS: "${BACKGROUND_AGENT_TIMEOUT_SECONDS:-600}"
      CODEX_API_MAX_FRAMES: "${BACKGROUND_AGENT_MAX_FRAMES:-50}"
      HTTP_PROXY: "${BACKGROUND_HTTP_PROXY:-}"
      HTTPS_PROXY: "${BACKGROUND_HTTPS_PROXY:-}"
      NO_PROXY: "${BACKGROUND_NO_PROXY:-}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "/workspace/JoyAI-VL-Interaction-main/services/background-agent"
    volumes:
      - "${CODE_ROOT:-..}:/workspace/JoyAI-VL-Interaction-main:ro"
      - "${BACKGROUND_WORKSPACE_HOST:-../agent-workspace}:${BACKGROUND_WORKSPACE_CONTAINER:-/workspace/agent-workspace}:rw"
      - "${CODEX_HOME_HOST:-../services/background-agent/codex-home}:/codex-source:ro"
      - "background-tmp:/tmp:rw"
    ports:
      - "${BACKGROUND_AGENT_PORT:-8079}:${BACKGROUND_AGENT_PORT:-8079}"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        mkdir -p /tmp/codex-home "$$CODEX_API_WORKSPACE"
        cp -a /codex-source/. /tmp/codex-home/
        chown -R joybg:joybg /tmp/codex-home "$$CODEX_API_WORKSPACE"
        codex --version
        exec gosu joybg python3 -m uvicorn codex_api.main:app --host 0.0.0.0 --port "$$CODEX_API_PORT"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('CODEX_API_PORT', '8079'), timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 20

  webui:
    image: joyai-vl-app:latest
    build:
      context: .
      network: host
      dockerfile: Dockerfile.app
    working_dir: /workspace/JoyAI-VL-Interaction-main
    network_mode: host
    environment:
      # Bailian Qwen-Omni-Realtime cloud API configuration
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      OMNI_REALTIME_URL: "${OMNI_REALTIME_URL:-wss://llm-3ry3olqk3caoo2f0.cn-beijing.maas.aliyuncs.com/api-ws/v1/realtime}"
      OMNI_MODEL: "${OMNI_MODEL:-qwen3.5-omni-flash-realtime}"
      BACKGROUND_AGENT_API_URL: "http://127.0.0.1:${BACKGROUND_AGENT_PORT:-8079}"
      BACKGROUND_AGENT_WORKSPACE: "${BACKGROUND_WORKSPACE_CONTAINER:-/workspace/agent-workspace}"
      LIVE_VLM_LOCAL_FILE_ROOTS: "${LIVE_VLM_LOCAL_FILE_ROOTS:-/workspace/agent-workspace:/workspace/JoyAI-VL-Interaction-main/services/webui/src/joy_interaction_webui/html}"
      LIVE_VLM_HTML_ARTIFACT_DIR: "${LIVE_VLM_HTML_ARTIFACT_DIR:-html}"
      WEBUI_PORT: "${WEBUI_PORT:-8099}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "/workspace/JoyAI-VL-Interaction-main/services/webui/src"
    volumes:
      - "${CODE_ROOT:-..}:/workspace/JoyAI-VL-Interaction-main:rw"
      - "${BACKGROUND_WORKSPACE_HOST:-../agent-workspace}:${BACKGROUND_WORKSPACE_CONTAINER:-/workspace/agent-workspace}:rw"
    depends_on:
      background-agent:
        condition: service_healthy
    command:
      - python3
      - -m
      - joy_interaction_webui.server
      - --host
      - 0.0.0.0
      - --port
      - "${WEBUI_PORT:-8099}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, ssl, urllib.request; ctx=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:%s/' % os.environ.get('WEBUI_PORT', '8099'), context=ctx, timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  background-tmp:
